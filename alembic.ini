[alembic]
script_location = migrations
# Placeholder a proposito: el destino real llega por DATABASE_URL, que acepta
# una URL PostgreSQL o la ruta del archivo SQLite de la instancia. Ver
# migrations/env.py y scripts/run_migrations.sh.
sqlalchemy.url = postgresql://user:password@localhost/libracore

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
