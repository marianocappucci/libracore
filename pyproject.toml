[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "libracore"
description = "Motor comun reutilizable para la familia de productos LibraCore (Contalibra, Restolibra)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "Mariano Cappucci" },
]
dynamic = ["version"]
dependencies = [
    "starlette",
    "fastapi>=0.111.0",
    "jinja2>=3.1.4",
    "fpdf2>=2.8.0",
    "qrcode>=7.4.2",
    "Pillow",
    "httpx>=0.27",
    "cryptography>=42.0.0",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    # Solo para tests: leer de vuelta el texto y las POSICIONES de los PDF que
    # genera `pdf_generator`. Sin esto lo unico verificable es la firma
    # `%PDF-`, que un comprobante con la maqueta rota pasa igual — y la
    # maqueta es justo lo que hay que fijar (cuantos items entran en una hoja,
    # donde cae cada etiqueta).
    "pypdf>=5.0",
    "pytest-cov>=6",
    "ruff>=0.13",
    "pytest>=8.0",
    "httpx>=0.27",
    # Solo para tests: asertar sobre el compose que genera el provisioning por
    # ESTRUCTURA y no por substring. `- datos` aparece en los dos servicios, asi
    # que un `assert "- datos" in texto` pasa igual con el sidecar colgado de la
    # red compartida — que es justo el defecto que estos tests fijan.
    "PyYAML>=6.0",
    # La cadena de Alembic se ejercita en la suite (tests/db/test_migraciones.py),
    # asi que el extra de abajo hace falta tambien para correr los tests.
    "libracore[migrations]",
    # 🔴 Sin `build`, el test que verifica que las migraciones VIAJEN en el
    # wheel se saltea — y es el unico que contesta la pregunta real. Un skip
    # ahi se lee igual que un verde. Va en dev para que el CI tampoco lo
    # saltee.
    "build>=1.0",
]

# NO son dependencias de runtime: LibraCore no importa SQLAlchemy en ningun
# lado de la app. Las necesita solo la cadena de migraciones, que corre en el
# pipeline de deploy (scripts/run_migrations.sh).
migrations = [
    "alembic>=1.13,<2",
    "SQLAlchemy>=2.0,<3",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# Tags sin 'v' inicial en el numero de version (v0.1.0 -> 0.1.0), y un
# esquema simple para que un commit sin tag no rompa el build (usa el commit
# hash como sufijo de desarrollo en vez de fallar).
local_scheme = "no-local-version"

[project.scripts]
# 🔴 `migrations/` vive **adentro** de `libracore/` justamente para entrar en
# el wheel de acá abajo. Mientras estuvo en la raíz del repo quedaba fuera de
# `packages` y no viajaba: un consumidor instalado con pip no tenía forma de
# aplicarlas sin clonar el repo, y por eso 7 de las 14 bases con schema de
# LibraCore no tienen `alembic_version` ninguna. Hay un test que abre el wheel
# construido y lo verifica.
libracore-migrar = "libracore.migrar:main"

[tool.hatch.build.targets.wheel]
packages = ["libracore"]
# Los `__pycache__` de las revisiones no tienen por qué viajar.
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Una instancia que YA corrió la revisión 0002 del motor. Sin registrarla,
    # pytest la reporta como desconocida — y bajo `--strict-markers` el test se
    # caería: una marca que no existe no filtra nada.
    "las_cuatro: la base ya tiene las cuatro columnas de clients de la 0002",
]

# === lint + coverage (agregado 2026-07-31) ===
# Lint activado en los 12 repos de la familia el mismo dia. El ruleset es
# CURADO, no el default de ruff: el default tiraba entre 132 y 224 hallazgos
# por repo, casi todo estilo, y un lint que arranca en rojo se ignora desde el
# primer dia. Estas reglas dan CERO hallazgos hoy en los 12, asi que cualquier
# rojo futuro es una regresion real y no deuda vieja.
#
# F401 (import sin usar) queda AFUERA A PROPOSITO: son ~396 en la familia y
# buena parte son re-exports deliberados en __init__.py, donde el import ES la
# API publica del modulo. Sacarlos a ciegas rompe a quien importa desde ahi.
# Queda como backlog aparte, para revisar a mano archivo por archivo.
[tool.ruff]
line-length = 120
extend-exclude = ["frontend", "website", "node_modules"]

[tool.ruff.lint]
# Un solo regimen de lint para los 17 repos de la familia (etapa E2 de la
# auditoria, 2026-09-03). Antes convivian dos: este --el que ya usaban
# LibraCargo y LibraClub-- y uno mucho mas corto en los otros 15, que solo
# miraba errores seguros en runtime (E9/F63/F7/F811/F821/F822/F823/F841) y
# no veia orden de imports, modernizacion ni los patrones de bugbear.
#
# La longitud queda en 120, que es la que ya usaban 13 de los 15: bajarla a
# 100 agregaba ~400 E501 en la familia, que no tienen fix automatico y no
# arreglan nada.
select = ["E", "F", "I", "UP", "B"]

# 🔴 TRINQUETE, no "reglas que no importan". Cada linea lleva la cuenta del
# dia que se unifico el regimen: la lista SOLO se achica, y lo que no esta
# aca ya no puede entrar en codigo nuevo. Los casos auto-corregibles
# (orden de imports y modernizacion) se arreglaron en el mismo commit.
ignore = [
    "E702",      # 49 caso(s): dos sentencias en una linea separadas por `;`.
    "F401",      # 23 caso(s): import sin usar. 🔴 NO se auto-corrige a proposito: de los 430
              #   de la familia, 168 son RE-EXPORTS —`scripts/panel_admin.py`
              #   re-exporta 27 nombres que `libracore.admin.services` usa como
              #   `pa.find_client`, `pa.compose`, `pa._NPM_AVAILABLE`—. Borrarlos
              #   rompe el backoffice en runtime con los tests en verde.
    "B904",      # 16 caso(s): `raise ... from err` dentro de un except. Ruff NO tiene fix, ni
              #   siquiera unsafe: son a mano, una por una.
    "E501",      # 13 caso(s): linea de mas de 120. Sin fix automatico: hay que reescribirla.
    "E741",      # 6 caso(s): nombre de variable ambiguo (`l`, `I`, `O`). Renombrar a mano.
    "B905",      # 6 caso(s): `zip()` sin `strict=`.
    "UP031",     # 3 caso(s): formato con `%` en vez de f-string.
    "B017",      # 3 caso(s): `assertRaises(Exception)` a secas en un test.
    "UP040",     # 1 caso(s): pendiente de revisar.
    "UP042",     # 1 caso(s): pendiente de revisar.
    "B007",      # 1 caso(s): variable del loop sin usar en el cuerpo.
    "E731",      # 1 caso(s): lambda asignada a un nombre en vez de un `def`.
]

[tool.ruff.lint.per-file-ignores]
# Las migraciones las escribe el autogenerate: no se reformatean a mano.
"**/migrations/versions/*.py" = ["E501"]
# En un `__init__.py` el import "sin usar" ES la interfaz del paquete.
"**/__init__.py" = ["F401"]

[tool.ruff.lint.flake8-bugbear]
# `Depends()` en el default es el idioma de FastAPI, no un descuido.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.File",
    "fastapi.Form", "fastapi.Header", "fastapi.Cookie", "fastapi.Body",
]

[tool.coverage.run]
source = ["libracore"]
branch = true
omit = ["*/tests/*", "*/migrations/*", "*/.venv/*", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Piso de cobertura. Es un TRINQUETE, no una meta: se fijo 2 puntos por
# debajo de lo que el repo mide (80%, medido el 2026-09-03), asi que hoy pasa
# holgado y lo unico que puede ponerlo en rojo es una regresion. Cuando la
# cobertura suba de verdad, subir tambien este numero -- nunca bajarlo para
# que pase un cambio.
fail_under = 78
